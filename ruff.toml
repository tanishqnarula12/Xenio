# Lint for correctness first: syntax errors, undefined names, and in the app itself unused imports and variables.
# Style rules are not enforced yet: turning them on is a roadmap item (docs/ROADMAP.md).
target-version = "py311"
line-length = 160
extend-exclude = ["ui", "native", "node_modules", "user_required_steps"]

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841"]  # tests import fixtures and helpers for their side effects
